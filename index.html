<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM classList</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>DOM classList</h1>
    <p id="para">This is simple paragraph</p>
    <button id="btn1">Add Highlight</button>
    <button id="btn2">Remove Highlight</button>
    <p class="para">This is toggle paragraph</p>
    <button id="toggle">Toggle</button>
    <button id="check">Check</button>
    <p class="check"></p>
    <button id="active" disabled>Buy Now</button>
    <button id="mode">Theme</button>
    <script src="app.js"></script>
</body>

</html>
